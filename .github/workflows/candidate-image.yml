name: Build candidate OCI image

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/sync-*'

permissions:
  contents: write

concurrency:
  group: candidate-image-receipt-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build linux/amd64 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write candidate version
        shell: bash
        run: echo "candidate-${GITHUB_SHA::12}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: new-api:candidate-${{ github.sha }}
          outputs: type=oci,dest=/tmp/new-api-candidate.oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record archive digest
        id: digest
        shell: bash
        run: |
          SHA256=$(sha256sum /tmp/new-api-candidate.oci.tar | cut -d' ' -f1)
          echo "${SHA256}  new-api-candidate.oci.tar" | tee /tmp/new-api-candidate.oci.tar.sha256
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload candidate image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: new-api-candidate-${{ github.sha }}
          path: |
            /tmp/new-api-candidate.oci.tar
            /tmp/new-api-candidate.oci.tar.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Publish verifiable build receipt
        shell: bash
        env:
          OCI_SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --refs origin refs/notes/candidate-image >/dev/null; then
            git fetch origin refs/notes/candidate-image:refs/notes/candidate-image
          fi
          git notes --ref=candidate-image add -f -m "artifact=new-api-candidate-${GITHUB_SHA}
          oci_sha256=${OCI_SHA256}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "${GITHUB_SHA}"
          git push origin refs/notes/candidate-image
